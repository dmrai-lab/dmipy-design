name: tests
on:
  push:
    branches: [main]
  pull_request:
env:
  # NOW is many tiny SciPy SLSQP solves; single-threaded BLAS avoids thread-oversubscription.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  JAX_PLATFORMS: cpu   # dmipy-sim/fit pull JAX; CI is CPU-only
  # The 3.0 line is not on PyPI yet (dmipy-sim 3.0, dmipy-replay 0.2, dmipy-fit 3.0): CI installs each from the commit
  # this revision was tested against (dmipy-sim: the head of dmipy-sim#852, which makes `simulate`'s pack state its
  # acquisition's scanner class). Move each ref forward when the releases land and `pip install` resolves them from
  # PyPI instead.
  DMIPY_SIM_REF: 9be89dc6607762b66bc262723b4c7c6fda3189d7
  DMIPY_REPLAY_REF: 38110c577804e8d122b556ac556d2214b5401262
  DMIPY_FIT_REF: 54c4c95c6d27f710125e767d354c181150403377
jobs:
  core:
    # NOW / timing / PGSTE / the replay certificate — NumPy + SciPy + the two dmipy packages, fast feedback
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          pip install --no-deps -e .     # its dmipy-sim / dmipy-replay bounds name the releases above
          pip install pytest pytest-cov
      - run: pytest -q --ignore=tests/test_pulseq_export.py --ignore=tests/test_interop.py

  pulseq:
    # scanner-runnable .seq export round-trip — pulls dmipy-sim + pypulseq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          pip install --no-deps -e .
          pip install pytest "pypulseq>=1.4"
      - run: pytest -q tests/test_pulseq_export.py

  interop:
    # cross-package: a designed waveform -> dmipy-sim simulates -> dmipy-fit recovers it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          pip install --no-deps "dmipy-fit @ git+https://github.com/dmrai-lab/dmipy-fit@${DMIPY_FIT_REF}"
          pip install --no-deps -e .
          pip install pytest dipy "jax[cpu]"
      - run: pytest -q tests/test_interop.py
