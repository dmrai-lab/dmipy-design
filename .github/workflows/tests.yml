name: tests
on:
  push:
    branches: [main]
  pull_request:
env:
  # NOW is many tiny SciPy SLSQP solves; single-threaded BLAS avoids thread-oversubscription.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  JAX_PLATFORMS: cpu   # dmipy-sim/fit pull JAX; CI is CPU-only
  # The 3.0 line is not on PyPI yet (dmipy-analytic 3.0, dmipy-sim 3.0, dmipy-replay 0.2, dmipy-fit 3.0): CI installs
  # each from the commit this revision was tested against: dmipy-analytic, dmipy-sim and dmipy-replay at the merge of
  # dmipy-analytic#3 and the heads of dmipy-sim#884 and dmipy-replay#26 (the forms imported from dmipy-analytic; a merge commit keeps
  # each reachable on main), dmipy-fit at the merge of dmipy-fit#58. Move each ref forward when the releases land and
  # `pip install` resolves them from PyPI instead.
  DMIPY_ANALYTIC_REF: 784830d26e4ec15a5dae4a03f2d01000b73bed1b
  DMIPY_SIM_REF: ae69cc1f3986753e4fb0677e8c1f788de1698d02
  DMIPY_REPLAY_REF: fa2274ffeb8cf5a4e7608582dda9f67d5e350662
  DMIPY_FIT_REF: a89a55b890c462aa3f9f90c4a7314b97b7c70c3d
jobs:
  core:
    # NOW / timing / PGSTE / the replay certificate — NumPy + SciPy + the two dmipy packages, fast feedback
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}" \
                      "dmipy-analytic[special,jax] @ git+https://github.com/dmrai-lab/dmipy-analytic@${DMIPY_ANALYTIC_REF}"
          pip install --no-deps -e .     # its dmipy-sim / dmipy-replay bounds name the releases above
          pip install pytest pytest-cov
      - run: pytest -q --ignore=tests/test_pulseq_export.py --ignore=tests/test_interop.py

  pulseq:
    # scanner-runnable .seq export round-trip — pulls dmipy-sim + pypulseq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}" \
                      "dmipy-analytic[special,jax] @ git+https://github.com/dmrai-lab/dmipy-analytic@${DMIPY_ANALYTIC_REF}"
          pip install --no-deps -e .
          pip install pytest "pypulseq>=1.4"
      - run: pytest -q tests/test_pulseq_export.py

  interop:
    # cross-package: a designed waveform -> dmipy-sim simulates -> dmipy-fit recovers it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}" \
                      "dmipy-analytic[special,jax] @ git+https://github.com/dmrai-lab/dmipy-analytic@${DMIPY_ANALYTIC_REF}"
          pip install --no-deps "dmipy-fit @ git+https://github.com/dmrai-lab/dmipy-fit@${DMIPY_FIT_REF}"
          pip install --no-deps -e .
          pip install pytest dipy "jax[cpu]"
      - run: pytest -q tests/test_interop.py
