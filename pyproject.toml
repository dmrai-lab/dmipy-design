[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-design"
version = "0.1.0.dev0"
description = "Optimal acquisition design for diffusion MRI via JAX autodiff CRLB and B-tensor encoding"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "optax>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dmipy_design*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
