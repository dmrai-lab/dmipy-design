[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-design"
version = "2.0.1"
description = "Hardware-constrained diffusion-MRI gradient-waveform design (NOW: LTE/PTE/STE/OGSE/PGSTE), Pulseq I/O, and scanner constraints — instant-pulse public scope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# dmipy-sim bridge: NowDesign.to_sim_waveform, SequenceTiming.from_pulseq, scanner catalogue
sim = ["dmipy-sim>=2.1,<3"]
# scanner-runnable .seq export + offline delivery/PNS checks
pulseq = ["dmipy-sim>=2.1,<3", "pypulseq>=1.4"]
# cross-package interoperability tests: a designed waveform -> dmipy-sim -> dmipy-fit
interop = ["dmipy-sim>=2.1,<3", "dmipy-fit>=2.1,<3"]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/dmrai-lab/dmipy-design"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmipy_design*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow-running (deselect with '-m \"not slow\"')",
]
