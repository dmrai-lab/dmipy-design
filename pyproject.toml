[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-design"
version = "2.0.1"
description = "Hardware-constrained diffusion-MRI gradient-waveform design (NOW: LTE/PTE/STE/OGSE/PGSTE) over dmipy-sim's acquisition object and scanner limits, Pulseq I/O — instant-pulse public scope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # the acquisition object a design produces, the timing budget it is built to and the cited scanner
    # limits it is built under all live in dmipy-sim (dmipy-sim#173); this package is the optimisation over them
    "dmipy-sim>=2.2",
]

[project.optional-dependencies]
# scanner-runnable .seq export + offline delivery/PNS checks
pulseq = ["pypulseq>=1.4"]
# cross-package interoperability tests: a designed waveform -> dmipy-sim -> dmipy-fit
interop = ["dmipy-fit>=2.1"]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/dmrai-lab/dmipy-design"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmipy_design*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow-running (deselect with '-m \"not slow\"')",
]
